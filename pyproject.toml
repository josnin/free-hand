[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "free-hand-cli"
version = "0.2.5"
description = "Human-in-the-loop CLI for manually generated AI tool calls"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=9"]

[project.scripts]
fh = "free_hand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
